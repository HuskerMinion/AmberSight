# Camera rig: what the simulated cameras send, and what AmberSight should do
# with each. Read by rig.py.
#
# [[profile]]: a stream fed by ffmpeg (test pattern + tone) into MediaMTX at
#   <name>/main and <name>/sub. Each profile also becomes one camera on the
#   Basic-auth MediaMTX, with the login in the camera's fields.
#     codec      h264 | h265            sub_codec (default h264)
#     size       WxH of the main stream sub = WxH of the sub stream, or "" for none
#     fps, gop   frames per second, frames between keyframes
#     bframes    B-frames (H.264 only; default 0, as most cameras)
#     open_gop   H.265 only: keyframes are CRA pictures, not IDR (x265's own default;
#                seen on some cameras). Default false: IDR, as most cameras send
#     audio      none | aac | pcmu | pcma; audio_rate (Hz)
#
# [[case]]: one more camera, pointed at any server in the rig.
#     server     mtx-basic | mtx-digest | mtx-udp | gst-basic | gst-digest | stub
#     path       stream path, with any query string; sub = sub stream path
#                (sub_raw: a sub stream address written as it is, e.g. a bad one)
#     creds      fields | url | none (login in AmberSight's fields, in the URL, or none)
#     login      a [logins] entry
#     ingest     AmberSight's ingest setting (default auto)
#     overlay    burn the name and time into recordings (needs the ffmpeg pipeline)
#     expect     play | fail
#     expect_ingest  what GET /api/cameras must say (default native)
#     expect_error   for fail cases: a regex the camera's last error must match
#     audio      the recordings must have audio
#     check      extra checks: drop, tsjump, authcount, onvif-ptz, onvif-events

[logins]
viewer  = { user = "viewer", password = "simple1" }
special = { user = "admin",  password = "p@ss#w:rd/ x1" }      # GStreamer only
special_mtx = { user = "admin", password = "p@ss#w&rd$1" }    # MediaMTX refuses ':', '/' and spaces in logins
wrong   = { user = "viewer", password = "not-the-password" }
stub    = { user = "admin",  password = "right-pass" }
stubbad = { user = "admin",  password = "wrong-pass" }

