# ---------------------------------------------------------------- auth and transport

[[case]]
name = "basic-login-in-url"
server = "mtx-basic"
path = "h264-720-aac/main"
sub = "h264-720-aac/sub"
creds = "url"
login = "viewer"
audio = true

[[case]]
name = "basic-special-fields"
server = "mtx-basic"
path = "h264-720-aac/main"
creds = "fields"
login = "special_mtx"
audio = true

[[case]]
name = "basic-special-url"
server = "mtx-basic"
path = "h264-720-aac/main"
creds = "url"
login = "special_mtx"
audio = true

[[case]]
name = "digest-fields"
server = "mtx-digest"
path = "h264-720-aac/main"
sub = "h264-720-aac/sub"
creds = "fields"
login = "viewer"
audio = true

[[case]]
name = "digest-special-fields"
server = "mtx-digest"
path = "h265-1080/main"
creds = "fields"
login = "special_mtx"

[[case]]
name = "digest-special-url"
server = "mtx-digest"
path = "h265-1080/main"
creds = "url"
login = "special_mtx"

[[case]]
name = "udp-only-server"
server = "mtx-udp"
path = "h264-720-pcma/main"
creds = "fields"
login = "viewer"
# transport = "auto": TCP is refused (461), so the built-in reader asks over UDP.

[[case]]
name = "dahua-query-mtx"
server = "mtx-basic"
path = "cam/realmonitor?channel=1&subtype=0"
sub = "cam/realmonitor?channel=1&subtype=1"
creds = "fields"
login = "viewer"
audio = true

[[case]]
name = "query-login-mtx"
server = "mtx-basic"
path = "stream0?username=admin&password=q1w2e3"
creds = "none"

[[case]]
name = "ffmpeg-ingest-control"
server = "mtx-basic"
path = "h264-720-aac/main"
sub = "h264-720-aac/sub"
creds = "fields"
login = "viewer"
ingest = "ffmpeg"
expect_ingest = "ffmpeg"
audio = true

[[case]]
# A sub stream address without rtsp:// (as typed by hand): motion uses the
# main stream and the camera stays on the built-in reader.
name = "bad-sub-url"
server = "mtx-basic"
path = "h264-720-aac/main"
sub_raw = "stream2"
creds = "fields"
login = "viewer"

[[case]]
# A sub stream the camera does not have (404): motion moves to the main
# stream and the camera keeps playing (built-in reader, then ffmpeg).
name = "missing-sub-native"
server = "mtx-basic"
path = "h264-720-aac/main"
sub_raw = "rtsp://viewer:simple1@127.0.0.1:18554/no-such-path/sub"
creds = "fields"
login = "viewer"

[[case]]
name = "missing-sub-ffmpeg"
server = "mtx-basic"
path = "h264-720-aac/main"
sub_raw = "rtsp://viewer:simple1@127.0.0.1:18554/no-such-path/sub"
creds = "fields"
login = "viewer"
ingest = "ffmpeg"
expect_ingest = "ffmpeg"

[[case]]
# Burned-in text: the ffmpeg pipeline re-encodes the 4K main stream (on a
# hardware encoder when there is one) and decodes the sub stream for motion.
name = "overlay-sub-ffmpeg"
server = "mtx-basic"
path = "h264-4k-aac/main"
sub = "h264-4k-aac/sub"
creds = "fields"
login = "viewer"
overlay = true
expect_ingest = "ffmpeg"
audio = true

