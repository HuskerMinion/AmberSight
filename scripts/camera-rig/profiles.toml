# ---------------------------------------------------------------- faults

[[case]]
name = "fault-drop-after-20s"
server = "stub"
path = "drop"
creds = "none"
check = ["drop"]

[[case]]
name = "fault-describe-no-packets"
server = "stub"
path = "silent"
creds = "none"
expect = "fail"
expect_error = "(?i)no (video|picture|frames|data)|stall|silent|nothing|timed? ?out"

[[case]]
name = "fault-404-mtx"
server = "mtx-basic"
path = "no-such-camera/main"
creds = "fields"
login = "viewer"
expect = "fail"
expect_error = "(?i)not found|404|no stream|wrong path|address"

[[case]]
name = "fault-404-stub"
server = "stub"
path = "nothing-here"
creds = "none"
expect = "fail"
expect_error = "(?i)not found|404|no stream|wrong path|address"

[[case]]
name = "fault-wrong-password-mtx"
server = "mtx-basic"
path = "h264-720-aac/main"
creds = "fields"
login = "wrong"
expect = "fail"
expect_error = "(?i)user name or password|password|login|unauthori[sz]ed"

[[case]]
name = "fault-camera-off-login-in-url"
server = "off"
path = "h264Preview_01_main"
creds = "url"
login = "viewer"
expect = "fail"
expect_error = "(?i)refused|not reachable|unable to connect|off"

[[case]]
name = "fault-camera-off-login-in-fields"
server = "off"
path = "h264Preview_01_main"
creds = "fields"
login = "viewer"
expect = "fail"
expect_error = "(?i)refused|not reachable|unable to connect|off"

[[case]]
name = "fault-wrong-password-then-fixed"
server = "stub"
path = "authcount"
creds = "fields"
login = "stubbad"
check = ["authcount"]

# ---------------------------------------------------------------- ONVIF

[[case]]
name = "onvif-rigcam-ptz-events"
server = "mtx-basic"
path = "h264-720-aac/main"
sub = "h264-720-aac/sub"
creds = "fields"
login = "viewer"
onvif_port = 18001
trigger = "camera"
audio = true
check = ["onvif-ptz", "onvif-events"]

[[case]]
name = "onvif-go-ptz"
server = "mtx-basic"
path = "h264-720-nosub/main"
creds = "fields"
login = "viewer"
onvif_port = 18010
check = ["onvif-ptz"]
