# The image's Vulkan drivers: Mesa's AMD driver (RADV) only, for the AI on
# AMD graphics. dpkg leaves out Mesa's other Vulkan drivers and layers
# (Intel, NVIDIA's nouveau, the software one, virtual machines' ones).
path-exclude=/usr/lib/x86_64-linux-gnu/libvulkan_intel.so
path-exclude=/usr/lib/x86_64-linux-gnu/libvulkan_intel_hasvk.so
path-exclude=/usr/lib/x86_64-linux-gnu/libvulkan_nouveau.so
path-exclude=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
path-exclude=/usr/lib/x86_64-linux-gnu/libvulkan_virtio.so
path-exclude=/usr/lib/x86_64-linux-gnu/libvulkan_gfxstream.so
path-exclude=/usr/lib/x86_64-linux-gnu/libVkLayer_*
path-exclude=/usr/share/vulkan/icd.d/intel_*
path-exclude=/usr/share/vulkan/icd.d/nouveau_*
path-exclude=/usr/share/vulkan/icd.d/lvp_*
path-exclude=/usr/share/vulkan/icd.d/virtio_*
path-exclude=/usr/share/vulkan/icd.d/gfxstream_*
path-exclude=/usr/share/vulkan/explicit_layer.d/*
path-exclude=/usr/share/vulkan/implicit_layer.d/*
path-exclude=/usr/bin/mesa-overlay-control.py
