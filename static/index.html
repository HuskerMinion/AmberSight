<header>
  <div class="logo" role="link" tabindex="0" title="Go to your start page"><svg class="ic mark"><use href="#i-logo"/></svg><span class="lt"><b>Amber</b>Sight</span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="hdr-right">
    <div id="status"><span class="lamp" id="lamp"></span><button type="button" id="healthChip" class="healthchip" hidden><svg class="ic"><use href="#i-alert"/></svg><span class="hctext"></span></button><span id="statusText">connecting...</span><span class="clock" id="clock"></span></div>
    <button id="hdrShield" class="btn shieldbtn" title="Arm or disarm motion detection on all cameras (S)"><svg class="ic"><use href="#i-shield"/></svg><span id="shieldLbl">&hellip;</span></button>
    <button id="themeBtn" class="btn icon" title="Theme: Auto" aria-label="Change theme"><svg class="ic"><use id="themeUse" href="#i-sun"/></svg></button>
    <button id="keysBtn" class="btn icon" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><svg class="ic"><use href="#i-keys"/></svg></button>
    <div id="userMenu" class="usermenu">
      <button id="userBtn" class="btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu" title="Menu"><svg class="ic ic-user"><use href="#i-user"/></svg><span id="userName"></span><svg class="ic ic-dots"><use href="#i-dots"/></svg></button>
      <div id="userDrop" class="userdrop" hidden>
        <div id="acctInfo" class="acctinfo"></div>
        <div class="themeseg" role="group" aria-label="Theme"><span>Theme</span><button type="button" data-mode="auto">Auto</button><button type="button" data-mode="light">Light</button><button type="button" data-mode="dark">Dark</button></div>
        <div class="phoneonly">
          <button id="menuTl" role="menuitem">Time-lapse</button>
          <button id="menuHelp" role="menuitem">Help</button>
          <button id="menuKeys" role="menuitem">Keyboard shortcuts</button>
          <hr>
        </div>
        <button id="menuPopups" role="menuitemcheckbox" aria-checked="false">Alert pop-ups: Off</button>
        <button id="menuAwake" role="menuitemcheckbox" aria-checked="true" title="While AmberSight is open and showing, this computer's screen stays on and it does not go to sleep">Keep screen awake: On</button>
        <button id="menuText" role="menuitem" title="Make all text in AmberSight larger on this device">Text size: Normal</button>
        <button id="menuTlCtl" role="menuitem" title="Docked: the timeline controls sit under the cameras. Auto-hide: they float over the cameras and fade out while playing; tap to bring them back">Timeline controls: Docked</button>
        <button id="menuData" role="menuitem" title="Use less data on this device: smaller live and playback video (the cameras' sub streams)">Data saver: Auto</button>
        <button id="menuStart">Start page…</button>
        <button id="menuDbl">Double-click opens…</button>
        <button id="menuPush">Notifications on this device…</button>
        <button id="menuAcct">Your account…</button>
        <button id="menuPw">Change password</button>
        <button id="menuTrust">Trust this server (HTTPS)…</button>
        <button id="menuOut">Sign out</button>
      </div>
    </div>
  </div>
</header>

<div id="loginGate" role="dialog" aria-label="Sign in">
  <form id="loginForm" class="gcard" autocomplete="on" novalidate>
    <h2><span>Amber</span>Sight</h2>
    <p class="hint">Sign in first. Your access level controls which settings you can see and change.</p>
    <div id="credStep1">
      <label>Username <input id="credUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Password <input id="credPass" name="password" type="password" autocomplete="current-password"></label>
    </div>
    <div id="credStep2" hidden>
      <label id="credCodeBox">Code from your authenticator app <input id="credCode" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*"></label>
      <label id="credRecBox" hidden>Recovery code <input id="credRec" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
    </div>
    <button class="primary" id="credGo" type="submit">Sign in</button>
    <div id="credLinks" class="gate-links" hidden>
      <button type="button" class="gate-link" id="credUseRec">Use a recovery code</button>
      <button type="button" class="gate-link" id="credBack">Start over</button>
    </div>
    <p class="hint" id="credMsg" role="alert"></p>
  </form>
</div>

<div class="livewrap" id="liveWrap" data-side="left">
<aside id="dock" class="dock" aria-label="View"></aside>
<main>
  <section id="tab-live">
      <div class="livemain">
        <div class="livebar">
          <button id="dockOpen" class="btn dockopen" title="Open the sidebar: profile, picture, camera controls" aria-label="View"><svg class="ic"><use href="#i-panel"/></svg><span>View</span></button>
          <div id="layoutChips" class="chips" aria-label="Saved layouts"></div>
          <button id="layoutEdit" class="btn" data-menu="1" aria-haspopup="menu" title="Saved layouts: edit them, or arrange the cameras"><svg class="ic"><use href="#i-grid"/></svg><span>Layouts</span><svg class="ic lm-caret"><use href="#i-down"/></svg></button>
          <div id="viewStyle" class="seg vstyle" role="group" aria-label="View style (V)">
            <button type="button" data-style="grid" title="Grid: equal tiles, scroll for more (V cycles the styles)"><svg class="ic"><use href="#i-v-grid"/></svg><span>Grid</span></button>
            <button type="button" data-style="fit" title="Fit: every camera fills the window, no scrolling"><svg class="ic"><use href="#i-v-fit"/></svg><span>Fit</span></button>
            <button type="button" data-style="focus" title="Focus: the first camera large, the rest around it (Arrange picks which)"><svg class="ic"><use href="#i-v-focus"/></svg><span>Focus</span></button>
            <button type="button" data-style="focus2" title="Focus 2: the first two cameras large, the rest below"><svg class="ic"><use href="#i-v-focus2"/></svg><span>Focus 2</span></button>
          </div>
          <div id="pager" class="pager" hidden><button id="pagePrev" class="btn icon" aria-label="Previous page"><svg class="ic"><use href="#i-left"/></svg></button><span id="pageLbl">1 / 1</span><button id="pageNext" class="btn icon" aria-label="Next page"><svg class="ic"><use href="#i-right"/></svg></button></div>
          <button id="fsBtn" class="btn" title="Full screen: the cameras fill the screen (F)"><svg class="ic"><use href="#i-expand"/></svg><span>Full screen</span></button>
          <button id="tlToggle" class="btn" aria-pressed="false" title="Timeline: play back recordings with alerts (T)"><svg class="ic"><use href="#i-timeline"/></svg><span>Timeline</span></button>
          <button id="arrangeBtn" class="btn" hidden aria-pressed="false" title="Drag the tiles into the order you want"><svg class="ic"><use href="#i-arrange"/></svg><span>Done</span></button>
          <button id="splitBtn" class="btn" hidden title="Two servers side by side (or one above the other)"><svg class="ic"><use href="#i-v-focus2"/></svg><span>Split view</span></button>
          <button id="arrangeCancel" class="btn" hidden title="Discard the new order (Esc)"><span>Cancel</span></button>
          <span class="cyc"><label class="sw" title="Step through the pages of cameras by itself"><input type="checkbox" role="switch" id="cycleOn"><span class="sw-track" aria-hidden="true"></span><span class="sw-text">Cycle</span></label> <select id="cycleSec" aria-label="Seconds per page" hidden><option value="5">5 s</option><option value="10">10 s</option><option value="15">15 s</option><option value="30">30 s</option><option value="60">60 s</option></select></span>
        </div>
        <div class="grid" id="camGrid"></div>
        <div id="tlDock" class="tldock" hidden></div>
      </div>
    <div id="dockScrim" class="dockscrim" hidden></div>
  </section>
  <section id="tab-events" hidden>

      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18.5" cy="12" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
      <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 13v6.5h14V13"/></symbol>
      <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/></symbol>
    </defs></svg>
    <div id="searchBar" class="evbar">
      <div class="evchips" id="evChips">
        <button type="button" id="fCam" class="chip evchip" aria-haspopup="true" title="Choose cameras"><span>All cameras</span> <svg class="ic"><use href="#i-down"/></svg></button>
        <span class="evsep" aria-hidden="true"></span>
        <button type="button" class="chip evchip" data-obj="person" style="--c:var(--person)"><svg class="ic"><use href="#i-person"/></svg>Person</button>
        <button type="button" class="chip evchip" data-obj="vehicle" style="--c:var(--vehicle)"><svg class="ic"><use href="#i-car"/></svg>Vehicle</button>
        <button type="button" class="chip evchip" data-obj="animal" style="--c:var(--animal)"><svg class="ic"><use href="#i-paw"/></svg>Animal</button>
        <button type="button" class="chip evchip" data-obj="package" style="--c:var(--package)"><svg class="ic"><use href="#i-pkg"/></svg>Package</button>
        <button type="button" class="chip evchip" data-obj="face" style="--c:var(--face)"><svg class="ic"><use href="#i-face"/></svg>Face</button>
        <button type="button" class="chip evchip" data-obj="unusual" style="--c:var(--warn)" title="Events out of this camera's usual pattern"><svg class="ic"><use href="#i-alert"/></svg>Unusual</button>
        <button type="button" class="chip evchip" data-obj="other" style="--c:var(--muted)">Other</button>
        <span class="evsep" aria-hidden="true"></span>
        <button type="button" class="chip evchip" data-range="all">Any time</button>
        <button type="button" class="chip evchip" data-range="today">Today</button>
        <button type="button" class="chip evchip" data-range="7d">7 days</button>
        <button type="button" class="chip evchip" data-range="30d">30 days</button>
        <button type="button" class="chip evchip" data-range="custom" id="evCustom"><span>Custom</span></button>
        <span class="evsep" aria-hidden="true"></span>
        <button type="button" class="chip evchip" id="evProt" aria-pressed="false" title="Only events you chose to keep forever"><svg class="ic"><use href="#i-lock"/></svg>Kept</button>
        <label class="sw evhfa" title="Leave out events marked as not a real alert (X marks one)"><input type="checkbox" role="switch" id="evHideFA"><span class="sw-track" aria-hidden="true"></span><span class="sw-text"><b>Hide false alarms</b></span></label>
      </div>
      <label id="fSmartL" class="evsmart" hidden title="Smart search: describe what you are looking for, then press Enter"><svg class="ic"><use href="#i-search"/></svg><input id="fSmart" type="search" placeholder="Describe..." enterkeyhint="search" maxlength="200" aria-label="Describe what to find"></label>
      <button type="button" id="clearFilter" class="btn" hidden>Clear</button>
      <div class="evview" id="evView" role="group" aria-label="View"><button type="button" class="chip" data-view="list" aria-pressed="true">List</button><button type="button" class="chip" data-view="grid" aria-pressed="false">Grid</button></div>
      <button type="button" id="evMore" class="btn icon" aria-haspopup="true" aria-label="More" title="More"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
    <div id="smartResults" class="smq-res" hidden></div>
    <div id="eventTable" class="evsplit">
      <div class="evlist" id="evListWrap">
        <div class="evnote" id="evAiOff" hidden><span>Smart alerts are off, so every motion is listed.</span><a class="btn" href="#settings/detection/objects">Turn on</a></div>
        <div class="evbulk" id="evBulk" hidden></div>
        <div class="evscroll" id="evList" tabindex="-1"><div id="eventRows" role="listbox" aria-label="Events"></div><div id="evMoreRow" class="evmorerow" hidden><button type="button" class="btn" id="evLoadMore">Load more</button></div></div>
      </div>
      <div class="evplayer" id="evPlayer"><p class="empty evnone">Select an event to see it here.</p></div>
    </div>
  </section>
  <section id="tab-admin" hidden>
    <div id="adminNav" class="chips"></div>
    <div id="adminBody"></div>
  </section>
  <section id="tab-help" hidden></section>
</main>
</div>

<div class="big" id="lightbox">
  <div class="lbtop">
    <span id="fullName" class="fullname" hidden></span>
    <div class="lbtools" id="fullTools">
      <button class="btn glass" id="fullSnap" title="Save snapshot (P)"><svg class="ic"><use href="#i-camera"/></svg><span>Snapshot</span></button>
      <button class="btn glass" id="fullTl" title="Play back this camera's recordings (L)"><svg class="ic"><use href="#i-timeline"/></svg><span>Timeline</span></button>
      <button class="btn glass" id="fullClips" title="Clips from this camera"><svg class="ic"><use href="#i-play"/></svg><span>Clips</span></button>
      <button class="btn glass" id="fullClip" title="Record a 20 s clip now (C)"><svg class="ic"><use href="#i-rec"/></svg><span>Clip</span></button>
      <button class="btn glass" id="fullFs" title="Full screen: only this camera, nothing else on the screen (F)"><svg class="ic"><use href="#i-expand"/></svg><span>Full screen</span></button>
      <button class="btn glass" id="fullMenu" title="More for this camera (or right-click the picture)"><svg class="ic"><use href="#i-gear"/></svg><span>Camera</span></button>
      <button class="btn glass fullpanel" id="fullPanel" title="Camera controls: PTZ, talk, profile" aria-label="View"><svg class="ic"><use href="#i-panel"/></svg><span>View</span></button>
    </div>
    <button id="closeLight" class="btn glass lbclose" title="Close (Esc)"><svg class="ic"><use href="#i-x"/></svg><span>Close</span></button>
  </div>
  <button id="fullPrev" class="btn glass lbnav prev" aria-label="Previous camera"><svg class="ic"><use href="#i-left"/></svg></button>
  <button id="fullNext" class="btn glass lbnav next" aria-label="Next camera"><svg class="ic"><use href="#i-right"/></svg></button>
  <div id="lightContent"></div>
</div>
<noscript><p style="padding:20px">AmberSight needs JavaScript.</p></noscript>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
