name: docker
# Builds the Docker images of a published release and pushes them to the
# GitHub Container Registry. Started by hand after the GitHub release exists
# (RELEASING.md):
#
#   gh workflow run docker.yml -R HuskerMinion/AmberSight -f tag=v0.11.0
#
#   ghcr.io/huskerminion/ambersight:<version> and :latest   amd64 + arm64 (Dockerfile)
#   ghcr.io/huskerminion/ambersight:<version>-cuda and :cuda   amd64 (Dockerfile.cuda)
#
# Each architecture builds on its own runner (arm64 on GitHub's ARM runner, no
# emulation) and is pushed by digest; the merge job then makes the
# multi-architecture tags from those digests.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.11.0
        required: true
        type: string
      latest:
        description: Also move :latest and :cuda to this release
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/huskerminion/ambersight
  DESCRIPTION: Self-hosted camera recording and AI detection
  LICENSES: PolyForm-Noncommercial-1.0.0
  SOURCE: https://github.com/HuskerMinion/AmberSight
jobs:
  prepare:
    if: github.repository == 'HuskerMinion/AmberSight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
      created: ${{ steps.meta.outputs.created }}
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::tag must look like v1.2.3"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Version, commit and date
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          own=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$own" != "$version" ]; then
            echo "::error::Cargo.toml at $TAG says version $own, not $version"; exit 1
          fi
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
            CREATED=${{ needs.prepare.outputs.created }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the multi-architecture tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          CREATED: ${{ needs.prepare.outputs.created }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags="-t $IMAGE:$VERSION"
          if [ "$LATEST" = true ]; then tags="$tags -t $IMAGE:latest"; fi
          sources=""
          for d in *; do sources="$sources $IMAGE@sha256:$d"; done
          # Labels of the list itself (the registry page shows these).
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            --annotation "index:org.opencontainers.image.title=AmberSight" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.licenses=$LICENSES" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            $sources
      - name: Show the result
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  cuda:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # The CUDA image and its build need more room than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION-cuda"
            if [ "$LATEST" = true ]; then echo "$IMAGE:cuda"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cuda
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
            CREATED=${{ needs.prepare.outputs.created }}
